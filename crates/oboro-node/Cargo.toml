[package]
name = "oboro-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Oboro node: HTTP over the Nym mixnet (gate, tunnel, probe) for x402 agent payments"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
nym-sdk = "=1.21.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"



